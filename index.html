<head>
<title>Space Huggers: Frontiers</title>
<link rel=icon type=image/svg+xml href='favicon.svg'/>
<meta name="theme-color" content="#08111f">
<meta name="title" content="Space Huggers: Frontiers">
<meta name="author" content="Frank Force and Space Huggers community">
<meta name="description" content="A run and gun roguelike platformer with destructible environments">
<meta name=viewport content='width=device-width,initial-scale=1,user-scalable=0'>
<meta charset=utf-8>
<style>
html,body{margin:0;background:#050912;color:#dff;font-family:system-ui,monospace;overflow:hidden}#frontier-ui{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#193557 0,#07101e 55%,#02040a 100%);text-align:center;transition:opacity .5s}.panel{width:min(720px,90vw);padding:38px 24px;border:1px solid #4be1ff66;background:#071525dd;box-shadow:0 0 55px #00bde833}.logo{font-size:clamp(42px,9vw,92px);letter-spacing:.08em;color:#fff;text-shadow:4px 4px #e44b8d,-2px -2px #38e6ff;margin:0 0 8px}.subtitle{color:#75eaff;letter-spacing:.25em;margin-bottom:35px}.ui-btn{cursor:pointer;margin:8px;padding:14px 30px;border:1px solid #50e6ff;background:#10283d;color:#fff;font:inherit;font-weight:700;text-transform:uppercase;letter-spacing:.12em}.ui-btn:hover{background:#1e5871;box-shadow:0 0 20px #2de1ff66}.hidden{display:none!important}.cutscene{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:linear-gradient(#02030b,#101f3b);animation:stars 7s linear infinite}.planet{width:min(38vw,330px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe98a,#e87546 30%,#592c76 66%,#10142e 70%);box-shadow:0 0 80px #ff8b4d88}.cutscene h2{position:absolute;top:12%;font-size:clamp(22px,4vw,46px);letter-spacing:.18em}.cutscene p{position:absolute;bottom:16%;color:#9edcff;letter-spacing:.12em}.shop-grid{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.card{padding:15px;border:1px solid #34536b;min-width:125px}.card b{display:block;color:#ffcf73;margin-bottom:8px}.credits{color:#ffcf73}.small{font-size:12px;color:#8ca6b8}@keyframes stars{from{filter:hue-rotate(0)}to{filter:hue-rotate(25deg)}}
</style>
</head>
<body>
<div id="frontier-ui"><div class="panel"><h1 class=logo>SPACE<br>HUGGERS</h1><div class=subtitle>FRONTIERS // UPDATE 2.0</div><button class=ui-btn id=start-btn>Deploy</button><button class=ui-btn id=shop-btn>Armory &amp; skins</button><div class=small>Arrow keys move · Z / click fires · X rolls · C throws</div></div></div>
<div id=shop class="hidden" style="position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:#050912ee"><div class=panel><h2>ARMORY &amp; SKIN LAB</h2><p class=credits>Credits: <span id=credits>0</span></p><div class=shop-grid id=shop-items></div><button class=ui-btn id=shop-back>Back</button></div></div>
<div id=cutscene class="cutscene hidden"><div class=planet></div><h2>DESTINATION: VESPER-9</h2><p>Scanning atmosphere... landing zone acquired</p></div>
<script src=engine/engineUtil.js></script>
<script src=engine/engineDebug.js></script>
<script src=engine/engine.js></script>
<script src=engine/engineObject.js></script>
<script src=engine/engineWebGL.js></script>
<script src=engine/engineDraw.js></script>
<script src=engine/engineInput.js></script>
<script src=engine/engineAudio.js></script>
<script src=engine/engineTileLayer.js></script>
<script src=engine/engineParticle.js></script>
<script src=appObjects.js></script>
<script src=appCharacters.js></script>
<script src=appEffects.js></script>
<script src=appLevel.js></script>
<script src=app.js></script>
<script src=frontiers.js></script>
</body>
